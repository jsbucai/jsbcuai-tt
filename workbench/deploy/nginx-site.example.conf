# Merge only this virtual host into the EXISTING HTTPS entry point.
# Replace UL_BACKEND_LAN_IP and certificate paths after inspecting the live host.
# Permit backend 5191 only from that entry host; do not forward WAN 5191.
server {
    listen 443 ssl;
    server_name ul.yingyinghome.com;
    ssl_certificate /etc/letsencrypt/live/ul.yingyinghome.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ul.yingyinghome.com/privkey.pem;
    client_max_body_size 2m;
    location / {
        proxy_pass http://UL_BACKEND_LAN_IP:5191;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_buffering off;
    }
}
